# SPDX-License-Identifier: Apache-2.0
# cargo-dist configuration for the open-source `moochy` client (plan 07 §11).
# Lives at the root of the moochy-cli repository; the Cargo workspace is cli/.
# Regenerate .github/workflows/release.yml after any change: `dist generate`.
[workspace]
members = ["cargo:cli"]

[dist]
cargo-dist-version = "0.33.0"
# Only the `moochy` package ships (its [package.metadata.dist] dist = true); the other
# crates are libraries on crates.io, and moochy-sandbox's test helper never ships.
dist = false
ci = "github"
installers = ["shell", "npm", "homebrew"]
# Windows (and the PowerShell installer) once the client builds there:
# https://github.com/moochy-dev/moochy-cli/issues/7
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
# `npx -y moochy mcp` (plan 07 §5): unscoped package, fetches the signed binary.
npm-package = "moochy"
tap = "moochy-dev/homebrew-tap"
formula = "moochy"
# crates.io on every tag (.github/workflows/publish-crates.yml, secret CARGO_REGISTRY_TOKEN).
# Add "homebrew" (secret HOMEBREW_TAP_TOKEN) and "npm" (secret NPM_TOKEN) once those
# secrets exist, then run `dist generate`; until then their files ship on the release.
publish-jobs = ["./publish-crates"]
# Sigstore-signed SLSA build provenance for every artifact (actions/attest-build-provenance);
# users verify externally: `gh attestation verify <file> --repo moochy-dev/moochy-cli`.
github-attestations = true
# No silent auto-update (06 §12): `moochy update` verifies signatures itself.
install-updater = false
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
checksum = "sha256"
pr-run-mode = "plan"
# Reproducible-build flags injected into every build job; relative to
# .github/workflows/ (file: .github/build-setup.yml, same flags as
# deploy/client/scripts/repro-check.sh).
github-build-setup = "../build-setup.yml"
# Dependabot bumps the actions pinned in release.yml; `dist generate` re-pins them.
allow-dirty = ["ci"]

# Native runners for every Linux target (no cross toolchain in the musl
# artifacts that the reproducibility check rebuilds).
# publish-crates.yml checks out the repository: it needs contents: read.
[dist.github-custom-job-permissions]
"publish-crates" = { contents = "read" }

[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-24.04"
x86_64-unknown-linux-musl = "ubuntu-24.04"

# SPDX-License-Identifier: Apache-2.0
# Custom cargo-dist publish job (dist-workspace.toml `publish-jobs`): every
# release tag publishes the workspace crates to crates.io.
name: publish-crates
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
permissions:
  contents: read
jobs:
  crates-io:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # One crate at a time in dependency order, skipping versions already on
      # crates.io, so a rerun (rate limit, network) finishes the release.
      - name: cargo publish
        working-directory: cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for c in moochy-proto moochy-worker moochy-keylog moochy-sandbox moochy-tui moochy; do
            if out=$(cargo publish --locked -p "$c" 2>&1); then echo "published $c"
            elif grep -q 'already exists' <<<"$out"; then echo "$c: this version is already on crates.io"
            else echo "$out"; exit 1; fi
          done

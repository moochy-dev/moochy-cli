# SPDX-License-Identifier: Apache-2.0
# Called by the tag-triggered Release workflow (release.yml, job
# custom-attest-release): an independent rebuild of both Linux musl archives
# that must be bit-identical to the published ones, then Sigstore keyless
# signatures (cosign bundles) for exactly those archives (06 §12, 07 §11).
# Only a tag of this repository runs it, so the signing identity names the tag:
#   cosign verify-blob --bundle moochy-x86_64-unknown-linux-musl.tar.xz.sigstore.json \
#     --certificate-identity 'https://github.com/moochy-dev/moochy-cli/.github/workflows/attest-release.yml@refs/tags/vX.Y.Z' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com moochy-x86_64-unknown-linux-musl.tar.xz
# Every archive (darwin and gnu too) also has build provenance from release.yml:
#   gh attestation verify <file> --repo moochy-dev/moochy-cli --signer-workflow moochy-dev/moochy-cli/.github/workflows/release.yml
# Re-attest an existing release: gh workflow run attest-release.yml --ref vX.Y.Z
name: attest-release
on:
  workflow_call:
    inputs:
      plan: { required: true, type: string } # passed by cargo-dist; unused
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    # A tag of this repository only: never a branch, a fork or a pull request.
    if: github.repository == 'moochy-dev/moochy-cli' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # the tag's commit
      - run: sudo apt-get install -y musl-tools
      - run: rustup target add "${{ matrix.target }}" # in cli/: the pinned toolchain
        working-directory: cli
      - run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "moochy-${{ matrix.target }}.tar.xz" --dir "$RUNNER_TEMP/release"
      - name: Independent rebuild must equal the release
        run: deploy/client/scripts/repro-check.sh --target "${{ matrix.target }}" --against "$RUNNER_TEMP/release/moochy-${{ matrix.target }}.tar.xz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuilt-${{ matrix.target }}
          path: ${{ runner.temp }}/release/moochy-${{ matrix.target }}.tar.xz
          if-no-files-found: error

  sign:
    needs: rebuild
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload .sigstore.json bundles to the release
      id-token: write # Sigstore keyless (Fulcio) via GitHub OIDC
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: rebuilt-*, path: rebuilt, merge-multiple: true }
      - name: Sign the rebuilt archives, and only those
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'moochy-*-unknown-linux-musl.tar.xz' --dir published
          cd rebuilt
          for f in *.tar.xz; do
            cmp "$f" "../published/$f" # still the bytes the rebuild matched
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*.sigstore.json

# SPDX-License-Identifier: Apache-2.0
# Called by the tag-triggered Release workflow (release.yml, job
# custom-publish-image): the donor node image (deploy/client/container/Containerfile,
# used by deploy/client/compose/compose.yaml) for linux/amd64 and linux/arm64,
# each built on a native runner, pushed to ghcr.io/moochy-dev/moochy as the tag
# (and `latest` for a stable tag), with build provenance:
#   gh attestation verify oci://ghcr.io/moochy-dev/moochy:vX.Y.Z --repo moochy-dev/moochy-cli
name: publish-image
on:
  workflow_call:
    inputs:
      plan: { required: true, type: string } # passed by cargo-dist; unused
permissions:
  contents: read
env:
  IMAGE: ghcr.io/moochy-dev/moochy
jobs:
  build:
    # A tag of this repository only: never a branch, a fork or a pull request.
    if: github.repository == 'moochy-dev/moochy-cli' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # the tag's commit
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/client/container/Containerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
      - run: echo "$DIGEST" > "$RUNNER_TEMP/digest-${{ matrix.arch }}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        shell: bash
        run: |
          tags=(-t "$IMAGE:$TAG")
          case "$TAG" in *-*) ;; *) tags+=(-t "$IMAGE:latest") ;; esac # no `latest` for a prerelease
          refs=()
          for f in "$RUNNER_TEMP"/digests/digest-*; do refs+=("$IMAGE@$(cat "$f")"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

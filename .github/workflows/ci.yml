# SPDX-License-Identifier: Apache-2.0
# Build, lint and test the client on every PR and push (CONTRACT §10).
# Release builds: release.yml (cargo-dist); supply chain: supply-chain.yml.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: cli
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: cli }
      # `moochy run` needs unprivileged user namespaces (Ubuntu 23.10+ restricts them).
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

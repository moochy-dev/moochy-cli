[workspace]
resolver = "3"

[package]
name = "moochy-desktop"
version = "0.1.8"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/moochy-dev/moochy-cli"
homepage = "https://moochy.dev"
description = "Moochy desktop app: a small window over the moochy binary"
publish = false

[[bin]]
name = "moochy-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The window (webview, IPC, events). No plugins: no shell, fs, http, opener or updater (plan 14 §2.2).
tauri = { version = "2", features = [] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# The provider key is wiped from memory once it is written to the child's stdin.
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# NodeSource (snapshot, live events, actions over node.sock), Home, slug rules. No keychain: the
# window never opens the keystore, the `moochy` child does.
moochy = { path = "../cli/crates/node", default-features = false }
moochy-tui = { path = "../cli/crates/tui", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
needless_pass_by_value = "allow"

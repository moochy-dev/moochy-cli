[package]
name = "moochy-sandbox"
version = "0.1.0"
description = "Moochy sandbox: maintainer-side `moochy run` jail (Linux namespaces + Landlock + seccomp; macOS Seatbelt) and donor-side Worker privilege separation (CONTRACT §15)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "moochy_sandbox"

[[bin]]
name = "moochy-sandbox-test"
path = "src/bin/moochy_sandbox_test.rs"

[dependencies]
# The one place we touch raw syscalls through safe wrappers: namespaces, mounts,
# pivot_root, capabilities, prctl (no_new_privs / pdeathsig), rlimits, setsid,
# socketpair. Everything here is memory-safe; see src/sys.rs for the only unsafe.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "mount", "process", "thread", "net", "pipe", "runtime", "system"] }
# Safe Landlock LSM wrapper (best-effort ABI negotiation). Second FS/NET layer.
landlock = { version = "0.4", default-features = false }
# Safe seccomp-bpf compiler (from Firecracker). Deny-list + arch guard.
seccompiler = { version = "0.5", default-features = false }
# Raw syscall numbers / structs not yet surfaced by rustix (used only inside sys.rs).
libc = { version = "0.2", default-features = false, features = ["std"] }

[dev-dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }

[lints.rust]
# CONTRACT §15 exception: unsafe is permitted, confined to src/sys.rs and gated there.
unsafe_code = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
many_single_char_names = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
single_match_else = "allow"

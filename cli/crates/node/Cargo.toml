[package]
name = "moochy"
version = "0.1.0"
description = "Moochy node: gateway (API + MCP doors), worker, relay link"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
repository = "https://github.com/moochy-dev/moochy-cli"
homepage = "https://moochy.dev"

# cargo-dist ships this binary (dist-workspace.toml); archives carry the AppArmor
# profile for `moochy run` on Ubuntu 23.10+ (deploy/client/README.md).
[package.metadata.dist]
dist = true
include = ["../../../deploy/client/apparmor/"]

[lib]
name = "moochy_node"
path = "src/lib.rs"

[[bin]]
name = "moochy"
path = "src/main.rs"

[features]
# T-02-010: the OS keychain is the default keystore (encrypted file as fallback).
default = ["keychain"]
# OS keychain keystore backend (macOS Keychain, Linux Secret Service).
keychain = ["dep:keyring"]

[dependencies]
# Wire types, envelopes, signatures, money math, generated link.proto code (open, same workspace).
moochy-proto = { path = "../proto" }
# Firewall, provider adapters, stream parsers, tool-call inspection, outbox store.
moochy-worker = { path = "../worker" }
# Key-log verifier/mirror (spec/KEYLOG.md): KEY_ADDED proof of possession, sealable/gateway_allowed.
moochy-keylog = { path = "../keylog", features = ["http"] }
# CONTRACT §15: `moochy run` jail (15.1), lockdown_self + validator jail of the background process (15.2).
moochy-sandbox = { path = "../sandbox" }
# CONTRACT §20: `moochy tui` (ratatui + crossterm, the only UI crates); NodeSource lives here.
moochy-tui = { path = "../tui" }
# K_det for sealed refusal details (CONTRACT §3); same version moochy-proto already links.
hkdf = { version = "0.12", default-features = false }
tokio = { version = "1.47", default-features = false, features = ["rt-multi-thread", "net", "io-util", "io-std", "time", "sync", "macros", "signal", "process", "fs"] }
hyper = { version = "1.7", default-features = false, features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1.17", default-features = false, features = ["tokio", "service"] }
http-body-util = { version = "0.1", default-features = false }
bytes = { version = "1", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
webpki-roots = { version = "1", default-features = false }
# gRPC link (CONTRACT §12): client channel + codegen only (no axum router, no tonic TLS: our own
# rustls connector captures the RFC 9266 exporter). LocalControl is served with hyper's h2 server.
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-prost = { version = "0.14", default-features = false }
prost = { version = "0.14", default-features = false, features = ["std", "derive"] }
tokio-stream = { version = "0.1", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
lexopt = "0.3"
scrypt = { version = "0.11", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
# HMAC-SHA256 for local tokens and affinity keys (Secrets::mac): ring is already in the tree
# (rustls' crypto provider) and uses the CPU's SHA instructions; replaces the hmac crate.
ring = { version = "0.17", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
zeroize = { version = "1", default-features = false, features = ["alloc", "zeroize_derive"] }
subtle = { version = "2", default-features = false }
# MCP `files` (A171/A172): openat with O_NOFOLLOW per component + fstat of the opened fd, without
# unsafe code. Already in the tree (moochy-sandbox). `net` + `process`: CONTRACT §15.2 validator
# (SCM_RIGHTS from the key-less zygote, reaping its single-use children), same safe API.
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "net", "process"] }

# OS keychain (T-02-010). macOS: the native Keychain. Linux: Secret Service over a pure-Rust D-Bus
# client (no libdbus/C at build or run time); a host without a Secret Service daemon falls back
# to the encrypted file.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", optional = true, default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Naming/doc-only pedantic lints (same set as moochy-proto).
similar_names = "allow"
many_single_char_names = "allow"
doc_markdown = "allow"

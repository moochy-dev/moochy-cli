[package]
name = "moochy-proto"
version = "0.1.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Moochy wire protocol: encodings, frames, messages, envelopes, signatures, money math"

# Versions are chosen so hpke and ed25519-zebra share ONE curve25519-dalek (4.x) and ONE sha2 (0.10)
# (sha2/hkdf are only transitive now: our own hashing and HKDF go through ring).
[dependencies]
# Typed wire structs + JSON (serde_json is only fed bytes that passed json::check).
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# base64url-no-pad (strict, canonical) for every byte field in JSON.
base64 = { version = "0.22", default-features = false, features = ["std"] }
# Generated link.proto code (CONTRACT §12): messages (prost) + client/server stubs (tonic
# codegen only; the Node picks transport/TLS features itself).
prost = { version = "0.14", default-features = false, features = ["std", "derive"] }
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-prost = { version = "0.14", default-features = false }
# Zero-copy chunk buffers crossing into the data plane.
bytes = { version = "1", default-features = false, features = ["std"] }
# Chunk AEAD (ChaCha20-Poly1305), every SHA-256 and HKDF-SHA256 (CONTRACT §1): assembly
# implementations (sha2 0.10 is portable-only on aarch64 without its `asm` feature; measured).
# Measured on this arm64 box: RustCrypto chacha20poly1305 0.10 = ~200 MB/s (portable backend),
# far below the 800 MB/s target. ring is already in the Node via rustls' ring provider.
ring = { version = "0.17", default-features = false }
# HPKE RFC 9180 base mode, X25519/HKDF-SHA256/ChaCha20Poly1305 only.
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
# Ed25519 with ZIP-215 verification (CONTRACT §1).
ed25519-zebra = { version = "4", default-features = false, features = ["std"] }
# OS randomness (rand_core 0.9 is what hpke 0.13 takes).
rand_core = { version = "0.9", default-features = false, features = ["os_rng"] }
# Decompression of ANOTHER party's bytes (CONTRACT §15.2: no C code on hostile input): pure Rust,
# MIT, no transitive deps with these features (its only unsafe is a ring buffer, fuzzed under
# ASan by fuzz/); "std" only for io traits, no hash/dict_builder
# (content checksums are refused; the AEAD authenticates every byte).
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
# Compression of our OWN data only (C zstd kept: ruzstd's encoder has only a "Fastest" level,
# ratio 2.5 vs 3.6-3.8 and ~3x slower, measured). Default features off = no legacy formats.
zstd = { version = "0.14", default-features = false }
zeroize = { version = "1", default-features = false, features = ["std", "zeroize_derive"] }
subtle = { version = "2", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
module_name_repetitions = "allow"
# Doc/naming-only pedantic lints: every fallible fn returns the one coarse `Error` documented at
# its definition; byte-destructuring patterns use short names on purpose.
missing_errors_doc = "allow"
many_single_char_names = "allow"
similar_names = "allow"
doc_markdown = "allow"

[dev-dependencies]
# Counting global allocator for tests/perf.rs (proves zero allocation per chunk, CONTRACT §13).
stats_alloc = "0.1"

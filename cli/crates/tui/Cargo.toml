[package]
name = "moochy-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "moochy tui: the terminal dashboard (CONTRACT §20)"
publish = false

[dependencies]
# CONTRACT §20.4 / AGENTS.md: the only UI crates. ratatui 0.30 with its crossterm backend, no
# default features (no termion/termwiz backends, no serde, no macros we do not use).
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"

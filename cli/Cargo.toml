[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"

# cargo-dist builds use the release profile unchanged (reproducible, LTO, abort, stripped).
[profile.dist]
inherits = "release"

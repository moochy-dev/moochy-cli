# SPDX-License-Identifier: Apache-2.0
# cargo-deny policy for the open-source client (06 §12, CI-08).
#   cargo deny --manifest-path cli/Cargo.toml check --config deploy/client/deny.toml
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licences compatible with shipping Apache-2.0 binaries.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CA list)
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # AGENTS.md §3: no OpenSSL, rustls + ring only.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
    # ZIP-215 verification is required: ed25519-zebra, not ed25519-dalek.
    { name = "ed25519-dalek" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
